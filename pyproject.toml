[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dragon-gate"
version = "0.3.0"
description = "DRAGON//GATE — Security, networking, diagnostics, and orchestration for the BabelDragon ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TheBabelDragon"}]
keywords = ["networking", "security", "diagnostics", "autonomous-network", "babeldragon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
dashboard = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
dragon-gate = "dragon_gate.cli:app"

[project.urls]
Homepage = "https://github.com/TheBabelDragon/dragon-gate"
Repository = "https://github.com/TheBabelDragon/dragon-gate"
Issues = "https://github.com/TheBabelDragon/dragon-gate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dragon_gate" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
